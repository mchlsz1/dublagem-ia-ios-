name: Build Dublagem IA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar aplicativo
        run: |
          xcodebuild \
            -project DublagemIA.xcodeproj \
            -scheme DublagemIA \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compactar aplicativo
        run: |
          mkdir -p artifact
          cd ~/Library/Developer/Xcode/DerivedData
          APP_PATH=$(find . -path "*/Build/Products/Debug-iphonesimulator/DublagemIA.app" -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/artifact/DublagemIA-Simulator.zip"

      - name: Enviar aplicativo como artefato
        uses: actions/upload-artifact@v4
        with:
          name: DublagemIA-Simulator
          path: artifact/DublagemIA-Simulator.zip
